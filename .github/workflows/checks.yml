# The fast checks every pull request must pass, into dev and into main alike.
# The branch rules require the last job, `checks`, which gathers the others.
name: checks

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build the plugin and run the tests
        run: sh gradlew build
      - name: Keep the test reports when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: build/reports/tests
          retention-days: 7

  examples:
    name: examples build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Each example is its own Gradle build that includes this checkout, so it compiles against the API as it is here.
      - name: Build the arcade example
        run: sh gradlew -p examples/arcade build
      - name: Build the atlas example
        run: sh gradlew -p examples/atlas build

  titles:
    name: titles
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ci
      - name: Titles follow Conventional Commits
        run: sh ci/titles.sh

  promotion-source:
    name: promotion source
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      THIS_REPO: ${{ github.repository }}
    steps:
      - name: Only dev is promoted into main
        run: |
          if [ "$BASE_REF" != main ]; then
            echo "Into $BASE_REF: any branch may ask."
            exit 0
          fi
          if [ "$HEAD_REPO" = "$THIS_REPO" ] && [ "$HEAD_REF" = dev ]; then
            echo "dev into main: allowed."
            exit 0
          fi
          echo "::error::main only takes pull requests from this repository's dev branch. Open this one against dev."
          exit 1

  checks:
    name: checks
    if: always()
    needs: [build, examples, titles, promotion-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Every check passed or was skipped
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
