plugins {
    id 'java'
}

group = 'ai.resourcepack'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    // ai.resourcepack:common, which MC GUI depends on: the tests run the games with MC GUI's classes on the classpath.
    exclusiveContent {
        forRepository {
            maven { url = 'https://repo.resourcepack.ai' }
        }
        filter {
            includeGroup 'ai.resourcepack'
        }
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.248-stable'
    // A plugin of its own on the server, so never shaded.
    compileOnly 'ai.resourcepack:mcgui:0.2.0'
    // ArcadeBench and the tests run the games with no server: the engine's canvas, and Bukkit's types on the classpath.
    testImplementation 'io.papermc.paper:paper-api:26.3.build.248-stable'
    testImplementation 'ai.resourcepack:mcgui:0.2.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// The classpath ArcadeBench runs on: java -cp "$(../../gradlew -q benchClasspath)" ai.resourcepack.arcade.ArcadeBench
tasks.register('benchClasspath') {
    dependsOn 'testClasses'
    doLast { println sourceSets.test.runtimeClasspath.asPath }
}

base { archivesName = 'Arcade' }

processResources {
    inputs.property('version', project.version)
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}
